      var CATS = ['すべて','マウス','キーボード','ヘッドセット','マウスパッド','コントローラー','モニター','チェア','デスク','イヤホン'];
      var cat = 'すべて', sort = 'rec';
      var chips = document.getElementById('zukan-chips');
      var grid = document.getElementById('zukan-grid');
      var count = document.getElementById('zukan-count');
      CATS.forEach(function(c){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'zukan-chip' + (c===cat?' is-on':'');
        b.textContent = c;
        b.addEventListener('click', function(){ cat = c; render();
          chips.querySelectorAll('.zukan-chip').forEach(function(x){ x.classList.toggle('is-on', x.textContent===c); });
        });
        chips.appendChild(b);
      });
      document.getElementById('zukan-sort').addEventListener('change', function(){ sort = this.value; render(); });
      function esc(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
      function render(){
        var list = DATA.map(function(d,i){ d._i=i; return d; })
          .filter(function(d){ return cat==='すべて' || d.cat===cat; });
        if (sort==='asc') list.sort(function(a,b){ return a.yen-b.yen; });
        else if (sort==='desc') list.sort(function(a,b){ return b.yen-a.yen; });
        else list.sort(function(a,b){ return a._i-b._i; });
        count.textContent = list.length + '種を表示中';
        grid.innerHTML = list.map(function(d){
          return '<article class="zukan-card">'
            + '<span class="zukan-cat">' + esc(d.cat) + '</span>'
            + '<img class="zukan-img" src="' + d.img + '?v=gear21" alt="' + esc(d.name) + '" width="72" height="72" loading="lazy" decoding="async">'
            + '<h2 class="zukan-name">' + esc(d.name) + '</h2>'
            + (d.price ? '<p class="zukan-price">' + esc(d.price) + '</p>' : '')
            + '<div class="zukan-links">'
            + '<a class="zukan-buy" href="' + d.link + '" target="_blank" rel="noopener sponsored">Amazonで価格を見る</a>'
            + '<a class="zukan-guide" href="' + d.guide + '">' + esc(d.glabel) + '</a>'
            + '</div></article>';
        }).join('');
      }
      render();
    })();
